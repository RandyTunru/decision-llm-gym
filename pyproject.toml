[project]
name = "decision-llm"
version = "0.1.0"
description = "LoRA fine-tuning of a decision LLM for the 1-token approach (prefill + next-token log-probs)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14",
    "pyyaml>=6",
    "python-dotenv>=1",
    "pillow>=10",
    "torch>=2.12",
    "transformers>=5",
    "peft>=0.12",
    "wandb>=0.18",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # only torch/torchvision come from here

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
